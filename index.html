<div class="container">
    <h1 id="headline">Countdown to Koli's Birthday</h1>
    
    <div id="countdown">
        <div class="time-box">
            <span id="days">00</span>
            <p>Days</p>
        </div>
        <div class="time-box">
            <span id="hours">00</span>
            <p>Hours</p>
        </div>
        <div class="time-box">
            <span id="minutes">00</span>
            <p>Minutes</p>
        </div>
        <div class="time-box">
            <span id="seconds">00</span>
            <p>Seconds</p>
        </div>
    </div>

    <div id="content" class="emoji">
        <span>🎉</span>
        <span>🎂</span>
        <span>💖</span>
    </div>
</div>
